name: Pulse
options:
  bundleIdPrefix: com.shikanon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shikanon.pulse
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Pulse/Pulse.entitlements
      configs:
        Debug:
          INFOPLIST_FILE: Pulse/Info-Debug.plist
          PULSE_API_BASE_URL: http://localhost:8787/v1
          PULSE_UNIVERSAL_LINK_HOST: configure-links.invalid
        Release:
          INFOPLIST_FILE: Pulse/Info-Release.plist
          PULSE_API_BASE_URL: https://configure-api-origin.invalid/v1
          PULSE_UNIVERSAL_LINK_HOST: configure-links.invalid
    scheme:
      testTargets:
        - PulseTests
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseTests
        excludes:
          - Fixtures
      - path: PulseTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Pulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shikanon.pulse.tests
  PulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PulseUITests
    dependencies:
      - target: Pulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shikanon.pulse.uitests
schemes:
  PulseGenerationE2E:
    build:
      targets:
        Pulse: all
        PulseUITests:
          - test
    test:
      targets:
        - PulseUITests
