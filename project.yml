name: Pulse
options:
  bundleIdPrefix: com.shikanon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shikanon.pulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - PulseTests
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseTests
    dependencies:
      - target: Pulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shikanon.pulse.tests
