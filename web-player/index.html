<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pulse — Kinetic Garden</title>
    <style>
      :root { color-scheme: dark; --lime:#b4ff14; --violet:#9357ff; --ink:#050505; }
      * { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--ink); color:#fff; font-family:ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; overflow:hidden }
      main { position:relative; display:grid; min-height:100svh; place-items:center; isolation:isolate; background:radial-gradient(circle at 50% 76%, #293d0a 0, transparent 20%), radial-gradient(circle at 50% 45%, #32136a 0, transparent 42%), #030305; }
      canvas { position:absolute; inset:0; width:100%; height:100%; z-index:-1; touch-action:none; }
      header { position:absolute; top:max(26px, env(safe-area-inset-top)); left:clamp(20px,5vw,56px); right:clamp(20px,5vw,56px); display:flex; justify-content:space-between; align-items:center; }
      .brand { font-size:clamp(27px,4vw,38px); font-weight:800; letter-spacing:-.07em; } .status { display:flex; gap:12px; align-items:center; color:#d3d3d6; font-size:14px }
      .dot { width:8px;height:8px;border-radius:50%; background:var(--lime); box-shadow:0 0 14px var(--lime) }
      article { width:min(620px, calc(100vw - 44px)); align-self:end; margin-bottom:max(36px, env(safe-area-inset-bottom)); padding:24px; border:1px solid rgba(255,255,255,.16); border-radius:28px; background:rgba(10,10,11,.56); backdrop-filter:blur(18px); box-shadow:0 12px 60px rgba(0,0,0,.45) }
      .eyebrow { margin:0 0 12px; color:var(--lime); font-size:14px; font-weight:650; } h1 { font-size:clamp(35px,6vw,58px); letter-spacing:-.065em; margin:0; line-height:.95 } .byline { color:#bbb; margin:11px 0 0; font-size:16px } .description { max-width:42ch; color:#ededed; line-height:1.5; margin:20px 0 24px }
      .actions { display:flex; gap:12px; flex-wrap:wrap } button, a { appearance:none; border:0; color:#080808; font:inherit; font-weight:750; border-radius:999px; padding:12px 17px; background:var(--lime); cursor:pointer; text-decoration:none; } button.secondary { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.18) } button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
      .tip { position:absolute; bottom:18px; right:24px; font-size:13px; color:#ffffff9c }
      @media (max-width:620px) { article { padding:21px; border-radius:22px; margin-bottom:22px }.status span{display:none}.tip{display:none} }
    </style>
  </head>
  <body>
    <main>
      <canvas id="garden" aria-label="Interactive Kinetic Garden; move or tap to make it react"></canvas>
      <header><div class="brand">Pulse</div><div class="status"><i class="dot"></i><span>Interactive app</span></div></header>
      <article>
        <p class="eyebrow">Grow a chorus with every touch</p>
        <h1>Kinetic Garden</h1>
        <p class="byline">by @echoform · 12.4K likes</p>
        <p class="description">A living music garden. Move your cursor or tap to plant sounds and grow rhythms.</p>
        <div class="actions"><button id="remix">Remix this app</button><button id="sound" class="secondary">Enable sound</button></div>
      </article>
      <div class="tip">Tap anywhere to plant a note</div>
    </main>
    <script>
      const canvas = document.querySelector('#garden'), ctx = canvas.getContext('2d');
      let point = { x: innerWidth*.5, y: innerHeight*.62, pulse:0 }, notes=[], sound;
      function resize(){ const dpr=devicePixelRatio||1; canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0) } resize(); addEventListener('resize',resize);
      function seed(x,y){ notes.push({x,y,r:8,life:1,hue:78+Math.random()*40}); point={x,y,pulse:1}; if(sound) tone(220+Math.random()*420) }
      addEventListener('pointermove', e => { point.x=e.clientX; point.y=e.clientY }); canvas.addEventListener('pointerdown', e => seed(e.clientX,e.clientY));
      function tone(hz){ const o=sound.createOscillator(), g=sound.createGain();o.frequency.value=hz;g.gain.setValueAtTime(.08,sound.currentTime);g.gain.exponentialRampToValueAtTime(.001,sound.currentTime+.35);o.connect(g).connect(sound.destination);o.start();o.stop(sound.currentTime+.36) }
      document.querySelector('#sound').onclick=async()=>{ sound ??=new AudioContext();await sound.resume();document.querySelector('#sound').textContent='Sound on' };
      document.querySelector('#remix').onclick=()=>alert('Open Pulse on iPhone to make your remix.');
      function paint(t){ ctx.clearRect(0,0,innerWidth,innerHeight); const g=ctx.createRadialGradient(point.x,point.y,0,point.x,point.y,280);g.addColorStop(0,'rgba(190,255,25,.24)');g.addColorStop(1,'rgba(190,255,25,0)');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);
        for(let i=0;i<14;i++){ const y=innerHeight*(.2+i*.045)+Math.sin(t*.001+i)*22;ctx.beginPath();ctx.moveTo(-20,y);ctx.bezierCurveTo(innerWidth*.3,y-65,innerWidth*.7,y+65,innerWidth+20,y+Math.sin(t*.0013+i)*48);ctx.strokeStyle='rgba(134,65,255,.24)';ctx.lineWidth=1;ctx.stroke() }
        notes.forEach((n,i)=>{ n.life-=.004; n.r+=.42;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.strokeStyle=`hsla(${n.hue},100%,65%,${Math.max(n.life,0)})`;ctx.lineWidth=2;ctx.stroke(); if(n.life<=0)notes.splice(i,1) });
        point.pulse*=.94;for(let r=110;r>12;r-=24){ctx.beginPath();ctx.arc(point.x,point.y,r+Math.sin(t*.006)*4,0,Math.PI*2);ctx.strokeStyle=`rgba(180,255,20,${.04+r/750+point.pulse*.35})`;ctx.stroke()} requestAnimationFrame(paint) }
      requestAnimationFrame(paint);
    </script>
  </body>
</html>
